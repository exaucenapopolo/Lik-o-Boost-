<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Likéo Boost</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-yellow: #FFD700;
            --primary-blue: #2A5EE8;
            --primary-orange: #FF7A00;
            --dark-blue: #1A1F3C;
            --text-dark: #2d3748;
            --text-light: #718096;
            --white: #FFFFFF;
            --bg-color: #f7fafc;
            --input-border: #e2e8f0;
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Header & Logo */
        header {
            background-color: var(--white);
            box-shadow: var(--shadow-sm);
            padding: 15px 0;
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }
        .navbar { display: flex; justify-content: center; }
        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; font-size: 2rem;
            color: var(--dark-blue); text-decoration: none;
        }
        .logo span { color: var(--primary-blue); }
        .logo .dot { color: var(--primary-orange); }
        .logo .yellow { color: var(--primary-yellow); }

        /* Form Container */
        .auth-section {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 100px 0 40px;
        }
        .auth-card {
            background: var(--white);
            width: 100%; max-width: 420px;
            border-radius: 16px; padding: 40px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }
        .auth-card h2 { font-family: 'Montserrat', sans-serif; font-size: 1.8rem; margin-bottom: 8px; color: var(--dark-blue); }
        .auth-card p.subtitle { color: var(--text-light); margin-bottom: 30px; font-size: 0.95rem; }

        /* Google Button */
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 12px; margin-bottom: 20px;
            border: 1px solid var(--input-border); border-radius: 8px;
            background: var(--white); color: var(--text-dark);
            font-weight: 500; font-family: 'Poppins', sans-serif; font-size: 1rem;
            cursor: pointer; transition: var(--transition);
        }
        .btn-google:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .btn-google img { width: 20px; }

        /* Divider */
        .divider {
            display: flex; align-items: center; text-align: center; margin-bottom: 20px;
            color: var(--text-light); font-size: 0.9rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--input-border); }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        /* Inputs */
        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 12px 16px;
            border: 1px solid var(--input-border); border-radius: 8px;
            font-family: 'Poppins', sans-serif; font-size: 1rem;
            transition: var(--transition); background: #f8fafc;
        }
        .form-control:focus { outline: none; border-color: var(--primary-blue); background: var(--white); box-shadow: 0 0 0 3px rgba(42, 94, 232, 0.1); }
        
        .password-toggle {
            position: absolute; right: 15px; top: 38px;
            background: none; border: none; color: var(--text-light); cursor: pointer;
        }
        
        .error-message { color: #e53e3e; font-size: 0.8rem; margin-top: 4px; display: none; }
        .error-message.show { display: block; }

        /* Options */
        .form-options { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; margin-bottom: 25px; }
        .forgot-password { color: var(--primary-blue); text-decoration: none; font-weight: 500; }

        /* Submit Button */
        .btn-submit {
            width: 100%; padding: 14px;
            background: var(--primary-blue); color: var(--white);
            border: none; border-radius: 8px;
            font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: var(--transition); font-family: 'Poppins', sans-serif;
        }
        .btn-submit:hover { background: var(--dark-blue); }

        .auth-links { margin-top: 20px; font-size: 0.95rem; }
        .auth-links a { color: var(--primary-blue); text-decoration: none; font-weight: 600; }

        footer { text-align: center; padding: 20px 0; color: var(--text-light); font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Lik<span class="yellow">é</span>o<span class="dot">.</span>Boost</a>
        </div>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <h2>Bon retour !</h2>
            <p class="subtitle">Connectez-vous à votre compte</p>

            <button type="button" class="btn-google" id="btnGoogle">
                <i class="fab fa-google" style="color: #DB4437; font-size: 1.2rem;"></i> Continuer avec Google
            </button>

            <div class="divider">ou avec votre email</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" class="form-control" placeholder="votre@email.com" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="Votre mot de passe" required>
                    <button type="button" class="password-toggle" id="togglePassword"><i class="far fa-eye"></i></button>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-options">
                    <label><input type="checkbox"> Se souvenir de moi</label>
                    <a href="#" class="forgot-password" id="forgotPassword">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn-submit">Se Connecter</button>

                <div class="auth-links">
                    <p>Nouveau ici ? <a href="inscription.html">Créer un compte</a></p>
                </div>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Likéo Boost. Tous droits réservés.</p>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDp4CpK_L6jlvE63eW4Q4BCemGPoXarbrw",
            authDomain: "likeo-5e3e9.firebaseapp.com",
            projectId: "likeo-5e3e9",
            storageBucket: "likeo-5e3e9.firebasestorage.app",
            messagingSenderId: "1071170297332",
            appId: "1:1071170297332:web:fa5e60f75848b986712da1",
            measurementId: "G-RV38D7VYF5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Affichage des erreurs simples
        function showError(id, message) {
            const err = document.getElementById(id + 'Error');
            err.textContent = message;
            err.classList.add('show');
        }
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
        }

        // --- CONNEXION CLASSIQUE ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const cred = await auth.signInWithEmailAndPassword(email, password);
                await db.collection('users').doc(cred.user.uid).update({
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
                window.location.href = 'dashboard.html';
            } catch (error) {
                if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    showError('password', 'Email ou mot de passe incorrect.');
                } else {
                    showError('email', 'Une erreur est survenue.');
                }
            }
        });

        // --- CONNEXION GOOGLE ---
        document.getElementById('btnGoogle').addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Vérifier si le compte existe dans la base de données
                const docRef = await db.collection('users').doc(user.uid).get();
                if (!docRef.exists) {
                    // C'est sa première connexion, on crée son profil
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        username: user.email.split('@')[0], // On génère un nom depuis l'email
                        email: user.email,
                        country: "Détecté via Google",
                        balance: 0,
                        role: 'user',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    // Il existe déjà, on met juste à jour sa dernière connexion
                    await db.collection('users').doc(user.uid).update({
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error("Erreur Google Auth:", error);
                alert("Erreur lors de la connexion avec Google.");
            }
        });

        // Toggle mot de passe
        document.getElementById('togglePassword').addEventListener('click', function() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
            this.innerHTML = input.type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
        });

        // Mot de passe oublié
        document.getElementById('forgotPassword').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if(!email) return alert('Veuillez entrer votre email dans le champ d\'adresse email.');
            try {
                await auth.sendPasswordResetEmail(email);
                alert('Email de réinitialisation envoyé ! Vérifiez votre boîte mail.');
            } catch (error) {
                alert('Erreur lors de l\'envoi de l\'email.');
            }
        });
    </script>
</body>
</html>
