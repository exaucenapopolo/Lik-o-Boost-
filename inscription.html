<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root {
            --primary-yellow: #FFD700;
            --primary-blue: #2A5EE8;
            --primary-orange: #FF7A00;
            --dark-blue: #1A1F3C;
            --light-gray: #F8F9FA;
            --text-dark: #333333;
            --text-light: #777777;
            --white: #FFFFFF;
            --success-green: #4CAF50;
            --error-red: #f44336;
            --warning-orange: #ff9800;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background: linear-gradient(135deg, #0A162B 0%, #1A1F3C 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Fond animé étoiles */
        .star-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        h1, h2, h3, h4 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-blue), var(--primary-orange));
            color: var(--white);
            box-shadow: 0 4px 15px rgba(42, 94, 232, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(42, 94, 232, 0.4);
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 15px 0;
            transition: var(--transition);
            background: rgba(26, 31, 60, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo span {
            color: var(--primary-yellow);
        }

        .logo .dot {
            color: var(--primary-orange);
            font-size: 2.2rem;
            line-height: 1;
        }

        /* Formulaire au centre */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 120px 20px 60px;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-size: 2.2rem;
            color: var(--dark-blue);
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--primary-blue), var(--primary-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-header p {
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--dark-blue);
            font-weight: 500;
        }

        .form-group label i {
            color: var(--primary-blue);
            margin-right: 8px;
            width: 20px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
            background: #f9f9f9;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-blue);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(42, 94, 232, 0.1);
        }

        .phone-group {
            display: flex;
            gap: 10px;
        }

        .phone-group input:first-child {
            max-width: 100px;
        }

        .error {
            color: var(--error-red);
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .success {
            color: var(--success-green);
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .btn-container {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-container button {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-light);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider:not(:empty)::before {
            margin-right: 1rem;
        }

        .divider:not(:empty)::after {
            margin-left: 1rem;
        }

        .link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
        }

        .link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .link a:hover {
            text-decoration: underline;
            color: var(--primary-orange);
        }

        /* Footer */
        footer {
            background: var(--dark-blue);
            color: var(--white);
            padding: 2rem 0;
            text-align: center;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);

            color: white;
            font-size: 1.2rem;
            transition: var(--transition);

        .social-icons a:hover {
            background: var(--primary-blue);

        .footer-bottom {
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);

        .footer-bottom a {
            color: var(--primary-yellow);
            text-decoration: none;
            transition: var(--transition);
            margin: 0 0.5rem;
        }

        .footer-bottom a:hover {
            color: var(--primary-orange);
            text-decoration: underline;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10000;
            opacity: 0;
            transform: translateX(100%);
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }

        .notification.success {
            background: var(--success-green);
            border-left: 4px solid #2E7D32;
        }

        .notification.error {
            background: var(--error-red);
            border-left: 4px solid #c62828;
        }

        .notification.warning {
            background: var(--warning-orange);
            border-left: 4px solid #ef6c00;
        }

        /* Loader */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-loading .loader {
            display: inline-block;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 1.5rem;
            }
            
            .form-header h2 {
                font-size: 1.8rem;
            }
            
            .phone-group {
                flex-direction: column;
            }
            
            .phone-group input:first-child {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 1.25rem;
            }
            
            header {
                padding: 10px 0;
            }
            
            .logo {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

    <script>
        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDAYnMPv7zDw_YTihyi5rKGtpws4BMqaWI",
            authDomain: "likeo-boost.firebaseapp.com",
            projectId: "likeo-boost",
            storageBucket: "likeo-boost.firebasestorage.app",
            messagingSenderId: "385658425556",
            appId: "1:385658425556:web:c7d7de5713ad565d34eb41",
            measurementId: "G-RECGZ5T342"
        };

        // Initialiser Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Variables globales
        let isSubmitting = false;

        // Fonction pour afficher les notifications
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const messageElement = document.getElementById('notification-message');
            
            // Définir l'icône selon le type
            let icon = 'fas fa-check-circle';
            if (type === 'error') icon = 'fas fa-exclamation-circle';
            if (type === 'warning') icon = 'fas fa-exclamation-triangle';
            
            notification.innerHTML = `<i class="${icon}"></i><span id="notification-message">${message}</span>`;
            notification.className = `notification ${type}`;
            
            // Afficher la notification
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            // Cacher après 5 secondes
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        // Créer le fond étoilé
        function createStarBackground() {
            const background = document.getElementById('starBackground');
            const numberOfStars = 100;
            
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Taille aléatoire entre 1px et 3px
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Position aléatoire
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // Délai d'animation aléatoire
                star.style.animationDelay = `${Math.random() * 3}s`;
                
                background.appendChild(star);
            }
        }

        // Mise à jour de l'indicatif téléphonique
        function updateIndicatif() {
            const codes = {
                // Afrique de l'Ouest
                'bj': '+229', 'bf': '+226', 'cv': '+238', 'ci': '+225', 'gm': '+220',
                'gh': '+233', 'gn': '+224', 'gw': '+245', 'lr': '+231', 'ml': '+223',
                'mr': '+222', 'ne': '+227', 'ng': '+234', 'sn': '+221', 'sl': '+232',
                'tg': '+228',
                // Afrique Centrale
                'cm': '+237', 'cf': '+236', 'td': '+235', 'cg': '+242', 'cd': '+243',
                'gq': '+240', 'ga': '+241', 'st': '+239',
                // Afrique de l'Est
                'bi': '+257', 'km': '+269', 'dj': '+253', 'er': '+291', 'et': '+251',
                'ke': '+254', 'mg': '+261', 'mw': '+265', 'mu': '+230', 'mz': '+258',
                'rw': '+250', 'sc': '+248', 'so': '+252', 'ss': '+211', 'tz': '+255',
                'ug': '+256', 'zm': '+260', 'zw': '+263',
                // Afrique du Nord
                'dz': '+213', 'eg': '+20', 'ly': '+218', 'ma': '+212', 'sd': '+249',
                'tn': '+216',
                // Afrique Australe
                'ao': '+244', 'bw': '+267', 'ls': '+266', 'na': '+264', 'za': '+27',
                'sz': '+268',
                // Autres
                'fr': '+33', 'be': '+32', 'ch': '+41', 'ca': '+1', 'us': '+1'
            };
            
            const paysSelect = document.getElementById('pays');
            const indicatifInput = document.getElementById('indicatif');
            const selectedValue = paysSelect.value;
            
            if (selectedValue && codes[selectedValue]) {
                indicatifInput.value = codes[selectedValue];
            } else {
                indicatifInput.value = '+';
            }
        }

        // Vérifier le code de parrainage
        async function checkReferralCode(referralCode) {
            if (!referralCode) return { valid: false };
            
            try {
                const querySnapshot = await db.collection('users')
                    .where('referralCode', '==', referralCode.toUpperCase())
                    .limit(1)
                    .get();
                
                if (!querySnapshot.empty) {
                    const referrerData = querySnapshot.docs[0].data();
                    return {
                        valid: true,
                        referrerId: querySnapshot.docs[0].id,
                        referrerUsername: referrerData.username || 'Utilisateur inconnu'
                    };
                } else {
                    return { valid: false };
                }
            } catch (error) {
                console.error("Erreur vérification parrainage:", error);
                return { valid: false };
            }
        }

        // Auto-remplir le code de parrainage depuis l'URL
        async function checkAndFillReferralCode() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCodeFromUrl = urlParams.get('ref');
            const referralInput = document.getElementById('referral');
            const referralSuccess = document.getElementById('referralSuccess');
            
            if (refCodeFromUrl) {
                // Auto-remplir le code de parrainage
                referralInput.value = refCodeFromUrl.toUpperCase();
                
                // Vérifier si le code est valide
                const result = await checkReferralCode(refCodeFromUrl);
                if (result.valid) {
                    referralSuccess.textContent = `✅ Code valide ! Vous êtes parrainé par ${result.referrerUsername}`;
                    referralSuccess.style.display = 'block';
                } else {
                    referralSuccess.textContent = '⚠️ Code de parrainage invalide';
                    referralSuccess.style.color = 'var(--error-red)';
                    referralSuccess.style.display = 'block';
                }
            }
        }

        // Vérification du code de parrainage (quand l'utilisateur entre manuellement)
        document.getElementById('referral').addEventListener('blur', async function() {
            const referralCode = this.value.trim();
            if (!referralCode) return;
            
            const referralSuccess = document.getElementById('referralSuccess');
            referralSuccess.textContent = '';
            referralSuccess.style.display = 'none';
            
            const result = await checkReferralCode(referralCode);
            if (result.valid) {
                referralSuccess.textContent = `✅ Code valide ! Vous êtes parrainé par ${result.referrerUsername}`;
                referralSuccess.style.display = 'block';
                referralSuccess.style.color = 'var(--success-green)';
            } else {
                referralSuccess.textContent = '⚠️ Code de parrainage invalide';
                referralSuccess.style.color = 'var(--error-red)';
                referralSuccess.style.display = 'block';
            }
        });

        // Gestion de l'inscription
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isSubmitting) return;
            
            const btn = document.getElementById('registerBtn');
            const loader = document.getElementById('registerLoader');
            
            btn.classList.add('btn-loading');
            isSubmitting = true;
            
            // Réinitialiser les erreurs
            document.querySelectorAll('.error').forEach(el => {
                el.textContent = '';
                el.style.display = 'none';
            });
            
            // Récupérer les valeurs
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const pays = document.getElementById('pays').value;
            const indicatif = document.getElementById('indicatif').value;
            const telephone = document.getElementById('telephone').value.trim();
            const referral = document.getElementById('referral').value.trim();
            
            // Validation
            let isValid = true;
            
            if (!username) {
                document.getElementById('usernameError').textContent = 'Veuillez entrer un nom d\'utilisateur';
                document.getElementById('usernameError').style.display = 'block';
                isValid = false;
            }
            
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('emailError').textContent = 'Veuillez entrer une adresse email valide';
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }
            
            if (!pays) {
                document.getElementById('countryError').textContent = 'Veuillez sélectionner votre pays';
                document.getElementById('countryError').style.display = 'block';
                isValid = false;
            }
            
            if (!telephone) {
                document.getElementById('phoneError').textContent = 'Veuillez entrer votre numéro de téléphone';
                document.getElementById('phoneError').style.display = 'block';
                isValid = false;
            }
            
            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Le mot de passe doit contenir au moins 6 caractères';
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }
            
            if (!isValid) {
                btn.classList.remove('btn-loading');
                isSubmitting = false;
                return;
            }
            
            try {
                // 1. Créer l'utilisateur avec Firebase Auth
                const { user } = await auth.createUserWithEmailAndPassword(email, password);
                const userId = user.uid;
                
                // 2. Générer un code de parrainage pour le nouvel utilisateur
                const generatedCode = Math.random().toString(36).substring(2,10).toUpperCase();
                
                // 3. Vérifier le code de parrainage utilisé
                let referredBy = null;
                let referrerId = null;
                
                if (referral) {
                    const referralResult = await checkReferralCode(referral);
                    if (referralResult.valid) {
                        referredBy = referral.toUpperCase();
                        referrerId = referralResult.referrerId;
                        
                        // Incrémenter le compteur de parrainage du parrain
                        await db.collection('users').doc(referrerId).update({
                            referralsCount: firebase.firestore.FieldValue.increment(1),
                            referralBalance: firebase.firestore.FieldValue.increment(100) // Bonus de parrainage
                        });
                    }
                }
                
                // 4. Créer le document utilisateur dans Firestore avec TOUS LES CHAMPS
                await db.collection('users').doc(userId).set({
                    // Informations de base
                    uid: userId,
                    username: username,
                    email: email,
                    phone: `${indicatif} ${telephone}`,
                    country: pays,
                    
                    // Parrainage
                    referralCode: generatedCode,
                    referredBy: referredBy,
                    referralsCount: 0,
                    referralBalance: 0,
                    
                    // Statistiques et solde
                    balance: 0,
                    totalOrders: 0,
                    activeOrders: 0,
                    totalSpent: 0,
                    
                    // Système
                    role: 'user',
                    status: 'active',
                    provider: 'email',
                    emailVerified: false,
                    welcomeModalShown: false,
                    isFirstAccess: true,
                    openedChests: [],
                    
                    // Métadonnées
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // 5. Envoyer l'email de vérification
                await user.sendEmailVerification();
                
                // 6. Afficher le succès
                showNotification('✅ Inscription réussie ! Redirection vers le tableau de bord...', 'success');
                
                // 7. Stocker les informations dans sessionStorage
                sessionStorage.setItem('userUID', userId);
                sessionStorage.setItem('userEmail', email);
                sessionStorage.setItem('userName', username);
                
                // 8. Rediriger vers le tableau de bord
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
                
            } catch (error) {
                console.error("Erreur d'inscription:", error);
                
                let errorMessage = "Une erreur s'est produite lors de l'inscription";
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = "Cet email est déjà utilisé";
                    document.getElementById('emailError').textContent = errorMessage;
                    document.getElementById('emailError').style.display = 'block';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = "Le mot de passe est trop faible";
                    document.getElementById('passwordError').textContent = errorMessage;
                    document.getElementById('passwordError').style.display = 'block';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = "L'adresse email n'est pas valide";
                    document.getElementById('emailError').textContent = errorMessage;
                    document.getElementById('emailError').style.display = 'block';
                }
                
                showNotification(`❌ ${errorMessage}`, 'error');
            } finally {
                btn.classList.remove('btn-loading');
                isSubmitting = false;
            }
        });

        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            // Créer le fond étoilé
            createStarBackground();
            
            // Initialiser l'indicatif
            updateIndicatif();
            
            // Vérifier le code de parrainage depuis l'URL
            checkAndFillReferralCode();
            
            // Vérifier si l'utilisateur est déjà connecté
            auth.onAuthStateChanged(user => {
                if (user) {
                    // Si l'utilisateur est déjà connecté, rediriger vers le tableau de bord
                    window.location.href = 'dashboard.html';
                }
            });
        });
    </script>
</body>
</html>
