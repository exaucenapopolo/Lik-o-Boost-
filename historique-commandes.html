<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Historique des Commandes - Likéo Boost</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary-yellow: #FFD700;
            --primary-blue: #2A5EE8;
            --primary-orange: #FF7A00;
            --dark-blue: #1A1F3C;
            --light-blue: #F0F5FF;
            --light-gray: #F8F9FA;
            --text-dark: #333333;
            --text-light: #777777;
            --white: #FFFFFF;
            --success-green: #4CAF50;
            --error-red: #f44336;
            --warning-orange: #ff9800;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: #f5f7ff;
            min-height: 100vh;
        }

        h1, h2, h3, h4 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        .btn {
            display: inline-block; padding: 12px 24px;
            border-radius: 50px; text-decoration: none;
            font-weight: 600; font-size: 0.95rem;
            transition: var(--transition); cursor: pointer;
            border: none; text-align: center; white-space: nowrap;
        }

        .btn-primary { background-color: var(--primary-blue); color: var(--white); }
        .btn-primary:hover { background-color: var(--primary-orange); transform: translateY(-2px); }

        .mobile-header {
            background-color: var(--white); padding: 15px 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            position: sticky; top: 0; z-index: 100; width: 100%;
        }

        .mobile-header-content { display: flex; justify-content: space-between; align-items: center; }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            display: flex; align-items: center; gap: 8px;
            color: var(--primary-blue); text-decoration: none;
            font-weight: 500; font-size: 0.9rem;
        }

        .page-content { padding: 30px 0; }

        .page-title {
            font-size: 1.8rem; margin-bottom: 25px;
            color: var(--dark-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== STATS GRID (Likéo Boost Style) ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--white);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: var(--transition);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-blue);
        }
        .stat-card i { font-size: 1.6rem; margin-bottom: 8px; }
        .stat-value { font-size: 1.7rem; font-weight: 700; color: var(--dark-blue); }
        .stat-label { font-size: 0.8rem; color: var(--text-light); font-weight: 500; }
        
        .stat-total i { color: var(--primary-blue); }
        .stat-completed i { color: var(--success-green); }
        .stat-processing i { color: var(--primary-blue); }
        .stat-pending i { color: var(--warning-orange); }
        .stat-cancelled i { color: var(--error-red); }
        .stat-amount i { color: var(--primary-orange); }

        /* ===== CONTROLS BAR (Likéo Boost Style) ===== */
        .controls-bar {
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
            margin-bottom: 25px; justify-content: space-between;
        }
        .filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-btn {
            background: var(--white); border: 1px solid rgba(0,0,0,0.08);
            color: var(--text-dark); padding: 8px 16px; border-radius: 20px;
            cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: var(--transition);
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary-blue); border-color: var(--primary-blue); color: var(--white);
        }
        .control-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .currency-selector select, .limit-selector select, .sort-selector select {
            background: var(--white); border: 1px solid rgba(0,0,0,0.08);
            color: var(--text-dark); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem;
            cursor: pointer; font-family: 'Poppins', sans-serif; outline: none; transition: var(--transition);
        }
        .currency-selector select:focus, .limit-selector select:focus, .sort-selector select:focus {
            border-color: var(--primary-blue);
        }

        .orders-container { display: flex; flex-direction: column; gap: 15px; }

        .order-card {
            background: var(--white); border-radius: 15px;
            padding: 20px; box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
        }
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.1);
        }

        .order-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 15px;
            flex-wrap: wrap; gap: 10px;
        }

        .order-id {
            font-weight: 700; color: var(--primary-blue);
            font-size: 1.1rem;
        }

        .order-meta {
            display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
            font-size: 0.85rem; color: var(--text-light);
        }

        .platform-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--light-blue); padding: 5px 12px;
            border-radius: 20px; font-weight: 600; color: var(--primary-blue);
            border: 1px solid rgba(42, 94, 232, 0.1);
        }

        .order-status {
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending { background: #FFF3E0; color: #E65100; }
        .status-processing, .status-in-progress, .status-partial { background: #E3F2FD; color: #1565C0; }
        .status-completed { background: #E8F5E9; color: #2E7D32; }
        .status-canceled, .status-failed { background: #FFEBEE; color: #C62828; }

        /* ===== PROGRESS BAR ===== */
        .progress-bar-container {
            display: flex; align-items: center; gap: 10px; margin-top: 15px;
            flex-wrap: wrap;
        }
        .progress-bar {
            flex: 1; height: 8px; background: #eef2ff;
            border-radius: 10px; overflow: hidden; min-width: 100px;
        }
        .progress-fill {
            height: 100%; border-radius: 10px; transition: width 0.5s ease;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-orange));
        }
        .progress-percent {
            font-weight: 700; font-size: 0.9rem; min-width: 45px; text-align: right;
            color: var(--primary-blue);
        }

        /* ===== EXPANDABLE DETAILS ===== */
        .order-details {
            display: none; margin-top: 20px; padding-top: 15px;
            border-top: 1px solid #eef2ff;
            animation: fadeSlide 0.3s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .order-details.open { display: block; }
        
        .details-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 15px;
        }
        .detail-item {
            background: var(--light-gray); border-radius: 12px; padding: 12px;
            position: relative;
        }
        .detail-label {
            font-size: 0.7rem; color: var(--text-light); text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600;
        }
        .detail-value { font-weight: 500; font-size: 0.9rem; word-break: break-all; display: flex; align-items: center; gap: 5px; }
        .detail-value a { color: var(--primary-blue); text-decoration: none; font-weight: 600; }
        .detail-value a:hover { text-decoration: underline; }

        .copy-btn {
            background: none; border: none; color: var(--text-light); cursor: pointer;
            padding: 2px 5px; font-size: 0.8rem; opacity: 0.6; transition: 0.2s;
            display: inline-flex; align-items: center;
        }
        .copy-btn:hover { opacity: 1; color: var(--primary-blue); }
        .copied-tooltip {
            position: absolute; top: -25px; right: 10px; background: var(--primary-blue);
            color: var(--white); font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
            pointer-events: none; opacity: 0; transition: opacity 0.2s;
        }

        .comments-section {
            background: rgba(76, 175, 80, 0.05); border: 1px solid rgba(76, 175, 80, 0.2);
            border-radius: 12px; padding: 12px; margin-top: 12px;
        }
        .comments-title {
            font-weight: 600; color: var(--success-green); margin-bottom: 8px;
            display: flex; align-items: center; gap: 8px;
        }
        .comments-content { font-style: italic; color: var(--text-dark); font-size: 0.9rem; }

        /* ===== SHARE SECTION ===== */
        .share-section {
            margin-top: 15px; padding-top: 15px;
            border-top: 1px solid #eef2ff;
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        }
        .share-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: var(--white); padding: 10px 18px; border: none; border-radius: 50px;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            transition: var(--transition); box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
        }
        .share-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4); }
        .share-btn.facebook {
            background: linear-gradient(135deg, #1877F2, #0C5DC7);
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.2);
        }
        .share-btn.copy-share {
            background: linear-gradient(135deg, var(--primary-blue), #507eff);
            box-shadow: 0 4px 15px rgba(42, 94, 232, 0.2);
        }

        /* ===== EXOSUPPLIER ACTIONS ===== */
        .exo-actions {
            display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;
        }
        .exo-btn {
            padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; gap: 6px;
            transition: var(--transition); color: var(--white);
        }
        .exo-btn:hover { transform: translateY(-2px); }
        .exo-btn.status { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
        .exo-btn.refill { background: linear-gradient(135deg, #10B981, #059669); }
        .exo-btn.cancel { background: linear-gradient(135deg, #EF4444, #DC2626); }

        .load-more { text-align: center; margin-top: 25px; }
        .toggle-icon { color: var(--primary-blue); font-size: 1.1rem; transition: var(--transition); margin-left: 10px; }

        .empty-state {
            text-align: center; padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state i { font-size: 4rem; margin-bottom: 20px; opacity: 0.3; }
        .empty-state h3 { margin-bottom: 10px; color: var(--text-dark); }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
        }

        .loading-overlay.hidden { display: none; }

        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== NOTIFICATIONS SLIDE ===== */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <header class="mobile-header">
        <div class="container">
            <div class="mobile-header-content">
                <a href="dashboard.html" class="back-btn" data-testid="link-back-dashboard">
                    <i class="fas fa-arrow-left"></i>
                    Retour
                </a>
                <div class="logo">Likéo</div>
            </div>
        </div>
    </header>

    <main class="page-content">
        <div class="container">
            <h1 class="page-title" data-aos="fade-up"><i class="fas fa-history"></i> Historique des Commandes</h1>
            
            <!-- Statistiques dynamiques (Likéo Boost Style) -->
            <div class="stats-grid" data-aos="fade-up" data-aos-delay="100">
                <div class="stat-card stat-total">
                    <i class="fas fa-shopping-cart"></i>
                    <div class="stat-value" id="totalOrders">0</div>
                    <div class="stat-label">Total commandes</div>
                </div>
                <div class="stat-card stat-completed">
                    <i class="fas fa-check-circle"></i>
                    <div class="stat-value" id="completedOrders">0</div>
                    <div class="stat-label">Terminées</div>
                </div>
                <div class="stat-card stat-processing">
                    <i class="fas fa-sync-alt"></i>
                    <div class="stat-value" id="processingOrders">0</div>
                    <div class="stat-label">En cours</div>
                </div>
                <div class="stat-card stat-pending">
                    <i class="fas fa-clock"></i>
                    <div class="stat-value" id="pendingOrders">0</div>
                    <div class="stat-label">En attente</div>
                </div>
                <div class="stat-card stat-cancelled">
                    <i class="fas fa-times-circle"></i>
                    <div class="stat-value" id="cancelledOrders">0</div>
                    <div class="stat-label">Annulées</div>
                </div>
                <div class="stat-card stat-amount">
                    <i class="fas fa-coins"></i>
                    <div class="stat-value" id="totalAmount">0</div>
                    <div class="stat-label">Montant total dépensé</div>
                </div>
            </div>

            <!-- Barre de Filtres et Devises -->
            <div class="controls-bar" data-aos="fade-up">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Toutes</button>
                    <button class="filter-btn" data-filter="completed">Terminées</button>
                    <button class="filter-btn" data-filter="processing">En cours</button>
                    <button class="filter-btn" data-filter="pending">En attente</button>
                    <button class="filter-btn" data-filter="cancelled">Annulées</button>
                </div>
                
                <div class="control-group">
                    <div class="sort-selector">
                        <select id="sortSelect">
                            <option value="date-desc" selected>Date (récent en premier)</option>
                            <option value="date-asc">Date (ancien en premier)</option>
                            <option value="amount-desc">Montant (élevé en premier)</option>
                            <option value="amount-asc">Montant (faible en premier)</option>
                            <option value="status">Statut</option>
                        </select>
                    </div>
                    
                    <div class="currency-selector">
                        <select id="currencySelect">
                            <option value="CM" selected>Cameroun (FCFA)</option>
                            <option value="SN">Sénégal (FCFA)</option>
                            <option value="CI">Côte d'Ivoire (FCFA)</option>
                            <option value="BF">Burkina Faso (FCFA)</option>
                            <option value="ML">Mali (FCFA)</option>
                            <option value="BJ">Bénin (FCFA)</option>
                            <option value="TG">Togo (FCFA)</option>
                            <option value="NE">Niger (FCFA)</option>
                            <option value="GA">Gabon (FCFA)</option>
                            <option value="CG">Congo (FCFA)</option>
                            <option value="CD">RD Congo (CDF)</option>
                            <option value="GH">Ghana (GHS)</option>
                            <option value="NG">Nigeria (NGN)</option>
                            <option value="KE">Kenya (KES)</option>
                            <option value="UG">Ouganda (UGX)</option>
                            <option value="TZ">Tanzanie (TZS)</option>
                            <option value="RW">Rwanda (RWF)</option>
                            <option value="ZM">Zambie (ZMW)</option>
                        </select>
                    </div>

                    <div class="limit-selector">
                        <select id="limitSelect">
                            <option value="10">10 par page</option>
                            <option value="15">15 par page</option>
                            <option value="20">20 par page</option>
                            <option value="30">30 par page</option>
                            <option value="50" selected>50 par page</option>
                        </select>
                    </div>

                    <button class="btn btn-primary" id="refreshBtn" style="padding: 10px 20px;" data-testid="button-refresh-orders">
                        <i class="fas fa-sync-alt"></i> Actualiser
                    </button>
                </div>
            </div>

            <!-- Conteneur des commandes -->
            <div class="orders-container" id="ordersContainer" data-aos="fade-up" data-aos-delay="200">
                <div class="empty-state">
                    <i class="fas fa-shopping-bag"></i>
                    <h3>Chargement...</h3>
                </div>
            </div>

            <div class="load-more" id="loadMoreContainer" style="display:none;">
                <button id="loadMoreBtn" class="btn btn-primary"><i class="fas fa-chevron-down"></i> Voir plus</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDp4CpK_L6jlvE63eW4Q4BCemGPoXarbrw",
            authDomain: "likeo-5e3e9.firebaseapp.com",
            projectId: "likeo-5e3e9",
            storageBucket: "likeo-5e3e9.firebasestorage.app",
            messagingSenderId: "1071170297332",
            appId: "1:1071170297332:web:fa5e60f75848b986712da1",
            measurementId: "G-RV38D7VYF5"
        };

        let app, auth, db;
        try {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
            console.log("Firebase initialisé");
        } catch (error) {
            console.error("Erreur Firebase:", error);
        }

        const API_BASE_URL ='';

        const COUNTRIES_CONFIG = {
            CM: { name: 'Cameroun', currency: 'XAF', symbol: 'FCFA', rate: 1 },
            SN: { name: 'Sénégal', currency: 'XOF', symbol: 'FCFA', rate: 1 },
            CI: { name: 'Côte d\'Ivoire', currency: 'XOF', symbol: 'FCFA', rate: 1 },
            BF: { name: 'Burkina Faso', currency: 'XOF', symbol: 'FCFA', rate: 1 },
            ML: { name: 'Mali', currency: 'XOF', symbol: 'FCFA', rate: 1 },
            BJ: { name: 'Bénin', currency: 'XOF', symbol: 'FCFA', rate: 1 },
            TG: { name: 'Togo', currency: 'XOF', symbol: 'FCFA', rate: 1 },
            NE: { name: 'Niger', currency: 'XOF', symbol: 'FCFA', rate: 1 },
            GA: { name: 'Gabon', currency: 'XAF', symbol: 'FCFA', rate: 1 },
            CG: { name: 'Congo', currency: 'XAF', symbol: 'FCFA', rate: 1 },
            CD: { name: 'RD Congo', currency: 'CDF', symbol: 'CDF', rate: 4.35 },
            GH: { name: 'Ghana', currency: 'GHS', symbol: 'GHS', rate: 0.025 },
            NG: { name: 'Nigeria', currency: 'NGN', symbol: 'NGN', rate: 2.65 },
            KE: { name: 'Kenya', currency: 'KES', symbol: 'KES', rate: 0.22 },
            UG: { name: 'Ouganda', currency: 'UGX', symbol: 'UGX', rate: 6.25 },
            TZ: { name: 'Tanzanie', currency: 'TZS', symbol: 'TZS', rate: 4.2 },
            RW: { name: 'Rwanda', currency: 'RWF', symbol: 'RWF', rate: 2.15 },
            ZM: { name: 'Zambie', currency: 'ZMW', symbol: 'ZMW', rate: 0.045 }
        };

        let currentUser = null;
        let allOrders = [];
        let displayedOrders = [];
        let currentDisplayLimit = 50;
        let currentFilter = 'all';
        let currentSort = 'date-desc';
        let selectedCountry = 'CM';

        // Initialisation de AOS
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof AOS !== 'undefined') {
                AOS.init({ duration: 800, once: true, offset: 100 });
            }
        });

        function formatNumber(num) {
            return num.toLocaleString('fr-FR');
        }

        async function getAuthHeaders() {
            const token = await currentUser.getIdToken();
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function convertFromXAF(amountXAF) {
            const config = COUNTRIES_CONFIG[selectedCountry];
            if (!config) return amountXAF;
            return Math.round(amountXAF * config.rate);
        }
        
        function getCurrencySymbol() {
            return COUNTRIES_CONFIG[selectedCountry]?.symbol || 'FCFA';
        }

        function formatAmount(amountXAF) {
            const converted = convertFromXAF(amountXAF);
            const symbol = getCurrencySymbol();
            return `${converted.toLocaleString('fr-FR')} ${symbol}`;
        }

        function getStatusClass(status) {
            const s = (status || 'pending').toLowerCase();
            if (s.includes('succes') || s.includes('succès') || s.includes('complete') || s.includes('termine') || s.includes('terminé')) return 'status-completed';
            if (s.includes('en cours') || s.includes('process') || s.includes('progress') || s.includes('partiel') || s.includes('partial')) return 'status-processing';
            if (s.includes('en attente') || s.includes('pend')) return 'status-pending';
            if (s.includes('annul') || s.includes('rembours') || s.includes('cancel') || s.includes('fail') || s.includes('échou')) return 'status-canceled';
            return 'status-pending';
        }

        function getStatusText(status) {
            const s = (status || 'pending').toLowerCase();
            if (s.includes('succes') || s.includes('succès') || s.includes('complete') || s.includes('termine') || s.includes('terminé')) return 'Terminée';
            if (s.includes('en cours') || s.includes('process') || s.includes('progress')) return 'En cours';
            if (s.includes('partiel') || s.includes('partial')) return 'Partiel';
            if (s.includes('en attente') || s.includes('pend')) return 'En attente';
            if (s.includes('annul') || s.includes('rembours') || s.includes('cancel')) return 'Annulée';
            if (s.includes('fail') || s.includes('échou')) return 'Échouée';
            return status || 'En attente';
        }

        function calculateProgress(order) {
            const s = (order.status || '').toLowerCase();
            if (s.includes('succes') || s.includes('succès') || s.includes('complete') || s.includes('termine') || s.includes('terminé')) return 100;
            if (s.includes('annul') || s.includes('rembours') || s.includes('cancel') || s.includes('fail') || s.includes('échou')) return 0;
            const quantity = order.quantity || 0;
            const remains = order.remains !== undefined ? order.remains : quantity;
            if (quantity > 0) {
                return Math.min(100, Math.round(((quantity - remains) / quantity) * 100));
            }
            return 0;
        }

        function guessPlatform(serviceName, linkUrl) {
            const nameLower = (serviceName || '').toLowerCase();
            const linkLower = (linkUrl || '').toLowerCase();
            if (nameLower.includes('facebook') || linkLower.includes('facebook.com') || linkLower.includes('fb.')) return 'Facebook';
            if (nameLower.includes('instagram') || linkLower.includes('instagram.com')) return 'Instagram';
            if (nameLower.includes('tiktok') || linkLower.includes('tiktok.com')) return 'TikTok';
            if (nameLower.includes('twitter') || nameLower.includes(' x ') || linkLower.includes('twitter.com') || linkLower.includes('x.com')) return 'X (Twitter)';
            if (nameLower.includes('youtube') || linkLower.includes('youtube.com') || linkLower.includes('youtu.be')) return 'YouTube';
            if (nameLower.includes('telegram') || linkLower.includes('t.me')) return 'Telegram';
            if (nameLower.includes('spotify') || linkLower.includes('spotify.com')) return 'Spotify';
            if (nameLower.includes('linkedin') || linkLower.includes('linkedin.com')) return 'LinkedIn';
            if (nameLower.includes('twitch') || linkLower.includes('twitch.tv')) return 'Twitch';
            return 'Autre';
        }

        function getPlatformIcon(platform, serviceName, link) {
            const pf = (platform || guessPlatform(serviceName, link)).toLowerCase();
            if (pf.includes("instagram")) return "fab fa-instagram";
            if (pf.includes("facebook")) return "fab fa-facebook";
            if (pf.includes("tiktok")) return "fab fa-tiktok";
            if (pf.includes("youtube")) return "fab fa-youtube";
            if (pf.includes("twitter") || pf.includes("x")) return "fab fa-x-twitter"; 
            if (pf.includes("telegram")) return "fab fa-telegram";
            if (pf.includes("spotify")) return "fab fa-spotify";
            if (pf.includes("linkedin")) return "fab fa-linkedin";
            if (pf.includes("twitch")) return "fab fa-twitch";
            return "fas fa-globe";
        }

        function detectQuality(serviceName) {
            const nameLower = (serviceName || '').toLowerCase();
            const high = ['haute qualité', '(haute qualité)', 'hq', 'premium', 'réel', 'réels', 'actif', 'organique', 'high quality', 'real', 'genuine', 'no drop'];
            const medium = ['qualité moyenne', 'moyenne qualité', 'mq', 'mixte', 'standard', 'bot', 'cheap', 'fast', 'instant', 'medium quality'];
            for (const kw of high) if (nameLower.includes(kw)) return 'Haute qualité';
            for (const kw of medium) if (nameLower.includes(kw)) return 'Qualité moyenne';
            return 'Standard';
        }

        function generateShareMessage(orderData) {
            const lines = [];
            lines.push(`📋 *Commande ${orderData.orderId}*`);
            lines.push(`📅 Date : ${orderData.dateStr}`);
            lines.push(`🌐 Plateforme : ${orderData.platform || 'N/A'}`);
            lines.push(`🛠 Service : ${orderData.service}`);
            lines.push(`⭐ Qualité : ${orderData.quality}`);
            lines.push(`📊 Quantité : ${orderData.quantity}`);
            lines.push(`💰 Montant : ${orderData.formattedAmount}`);
            lines.push(`📌 Statut : ${orderData.statusLabel}`);
            if (orderData.link) lines.push(`🔗 Lien : ${orderData.link}`);
            if (orderData.contact) lines.push(`📞 Contact : ${orderData.contact}`);
            if (orderData.comments) lines.push(`💬 Commentaires : ${orderData.comments}`);
            lines.push('');
            lines.push(`✅ Commande lancée sur Likéo Boost`);
            lines.push(`🚀 likeo-boost.replit.app`);
            return lines.join('\n');
        }

        function renderShareSection(orderData) {
            const message = generateShareMessage(orderData);
            const encoded = encodeURIComponent(message);
            return `
              <div class="share-section">
                <button class="share-btn" onclick="event.stopPropagation(); window.open('https://api.whatsapp.com/send?text=${encoded}', '_blank')" title="Partager sur WhatsApp">
                  <i class="fab fa-whatsapp"></i> WhatsApp
                </button>
                <button class="share-btn facebook" onclick="event.stopPropagation(); window.open('https://www.facebook.com/sharer/sharer.php?u=https://likeo-boost.replit.app&quote=${encoded}', '_blank')" title="Partager sur Facebook">
                  <i class="fab fa-facebook"></i> Facebook
                </button>
                <button class="share-btn copy-share" onclick="event.stopPropagation(); copyTextToClipboard(\`${message.replace(/`/g, '\\`')}\`, this)" title="Copier le message">
                  <i class="far fa-copy"></i> Copier le message
                </button>
              </div>
            `;
        }

        function copyTextToClipboard(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                const notif = document.createElement('div');
                notif.className = 'copied-tooltip';
                notif.textContent = 'Copié !';
                notif.style.position = 'static';
                notif.style.opacity = '1';
                element.appendChild(notif);
                setTimeout(() => notif.remove(), 1500);
            });
        }

        function showNotification(message, type = 'info') {
            const existing = document.querySelector('.exo-notification');
            if (existing) existing.remove();
            const n = document.createElement('div');
            n.className = 'exo-notification';
            n.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                border-radius: 12px;
                color: #fff;
                font-weight: 500;
                z-index: 10000;
                animation: slideIn 0.3s ease;
                max-width: 350px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            `;
            n.style.background = type === 'success' ? 'linear-gradient(135deg, #4CAF50, #2E7D32)' 
                                 : type === 'error' ? 'linear-gradient(135deg, #f44336, #d32f2f)' 
                                 : 'linear-gradient(135deg, var(--primary-blue), #1a4cd0)';
            n.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle'}" style="margin-right:10px;"></i>${message}`;
            document.body.appendChild(n);
            setTimeout(() => { 
                n.style.animation = 'slideOut 0.3s ease'; 
                setTimeout(() => n.remove(), 300); 
            }, 4000);
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        async function loadOrders() {
            showLoading();
            const container = document.getElementById('ordersContainer');
            
            try {
                const headers = await getAuthHeaders();
                const response = await fetch(API_BASE_URL + `/api/orders/${currentUser.uid}`, {
                    headers: headers
                });
                const data = await response.json();

                if (!data.orders || data.orders.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-shopping-bag"></i>
                            <h3>Aucune commande</h3>
                            <p>Vous n'avez pas encore passé de commande</p>
                            <a href="dashboard.html" class="btn btn-primary" style="margin-top: 20px;">
                                Passer une commande
                            </a>
                        </div>
                    `;
                    updateStats([]);
                    return;
                }

                allOrders = data.orders;
                filterOrders(currentFilter);

            } catch (error) {
                console.error('Error loading orders:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Erreur de chargement</h3>
                        <p>Impossible de charger vos commandes</p>
                    </div>
                `;
            } finally {
                hideLoading();
            }
        }

        function filterOrders(filter) {
            if (filter === 'all') {
                displayedOrders = [...allOrders];
            } else {
                displayedOrders = allOrders.filter(order => {
                    const status = (order.status || '').toLowerCase();
                    if (filter === 'completed') return status.includes('succes') || status.includes('succès') || status.includes('complete') || status.includes('termine') || status.includes('terminé');
                    if (filter === 'processing') return status.includes('en cours') || status.includes('process') || status.includes('progress') || status.includes('partiel') || status.includes('partial');
                    if (filter === 'pending') return status.includes('en attente') || status.includes('pend');
                    if (filter === 'cancelled') return status.includes('annul') || status.includes('rembours') || status.includes('cancel');
                    return false;
                });
            }
            applySortAndDisplay();
        }

        function sortOrders(sortOption) {
            switch (sortOption) {
                case 'date-desc':
                    displayedOrders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                    break;
                case 'date-asc':
                    displayedOrders.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
                    break;
                case 'amount-desc':
                    displayedOrders.sort((a, b) => Number(b.cost || 0) - Number(a.cost || 0));
                    break;
                case 'amount-asc':
                    displayedOrders.sort((a, b) => Number(a.cost || 0) - Number(b.cost || 0));
                    break;
                case 'status':
                    const statusOrder = { 'terminée': 1, 'en cours': 2, 'partiel': 3, 'en attente': 4, 'annulée': 5, 'échouée': 6 };
                    displayedOrders.sort((a, b) => {
                        const statusA = getStatusText(a.status || '').toLowerCase();
                        const statusB = getStatusText(b.status || '').toLowerCase();
                        return (statusOrder[statusA] || 99) - (statusOrder[statusB] || 99);
                    });
                    break;
            }
        }

        function applySortAndDisplay() {
            sortOrders(currentSort);
            displayOrders();
            updateStats(allOrders);
        }

        function updateStats(orders) {
            const total = orders.length;
            const completed = orders.filter(o => {
                const s = (o.status || '').toLowerCase();
                return s.includes('succes') || s.includes('succès') || s.includes('complete') || s.includes('termine') || s.includes('terminé');
            }).length;
            const processing = orders.filter(o => {
                const s = (o.status || '').toLowerCase();
                return s.includes('en cours') || s.includes('process') || s.includes('progress') || s.includes('partiel') || s.includes('partial');
            }).length;
            const pending = orders.filter(o => {
                const s = (o.status || '').toLowerCase();
                return s.includes('en attente') || s.includes('pend');
            }).length;
            const cancelled = orders.filter(o => {
                const s = (o.status || '').toLowerCase();
                return s.includes('annul') || s.includes('rembours') || s.includes('cancel');
            }).length;

            const totalXAF = orders.reduce((sum, o) => sum + Number(o.cost || 0), 0);

            document.getElementById('totalOrders').textContent = total;
            document.getElementById('completedOrders').textContent = completed;
            document.getElementById('processingOrders').textContent = processing;
            document.getElementById('pendingOrders').textContent = pending;
            document.getElementById('cancelledOrders').textContent = cancelled;
            document.getElementById('totalAmount').textContent = formatAmount(totalXAF);
        }

        function displayOrders() {
            const container = document.getElementById('ordersContainer');
            const loadMoreContainer = document.getElementById('loadMoreContainer');
            const ordersToShow = displayedOrders.slice(0, currentDisplayLimit);

            if (ordersToShow.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox" style="opacity: 0.3; font-size:3rem;"></i>
                        <h3>Aucune commande trouvée</h3>
                        <p>Ajustez vos filtres ou effectuez une recherche</p>
                    </div>
                `;
                loadMoreContainer.style.display = 'none';
                return;
            }

            let html = '';
            ordersToShow.forEach((order, index) => {
                let dateStr = 'N/A';
                if (order.createdAt) {
                    dateStr = new Date(order.createdAt).toLocaleString('fr-FR');
                }

                const statusClass = getStatusClass(order.status);
                const statusText = getStatusText(order.status);
                const orderRef = order.orderId || `LKB-${String(order.id).slice(-6)}`;
                
                const platform = order.platform || guessPlatform(order.serviceName, order.link);
                const iconClass = getPlatformIcon(platform, order.serviceName, order.link);
                const quality = order.quality || detectQuality(order.serviceName);
                const progress = calculateProgress(order);
                const formattedPrice = formatAmount(order.cost || 0);

                const shareData = {
                    orderId: orderRef, dateStr, platform, service: order.serviceName, quality,
                    quantity: formatNumber(order.quantity || 0), formattedAmount: formattedPrice,
                    statusLabel: statusText, link: order.link, contact: order.contactInfo, comments: order.customComments
                };

                html += `
                    <div class="order-card" data-docid="${order.id}" data-testid="order-card-${index}">
                        <div class="order-header">
                            <div>
                                <span class="order-id">${orderRef}</span>
                                <div class="order-meta" style="margin-top:5px;">
                                    <span class="platform-badge"><i class="${iconClass}"></i> ${platform}</span>
                                    <span style="font-weight:600; color:var(--text-dark);">${order.serviceName || 'N/A'}</span>
                                </div>
                            </div>
                            <span class="order-status ${statusClass}">${statusText}</span>
                        </div>

                        <div class="progress-bar-container">
                            <span style="font-size:0.8rem; color:var(--text-light);">
                                ${formatNumber(order.quantity || 0)} ${order.isAutoOrder ? `· ${formatNumber((order.quantity || 0) - (order.remains || 0))} livrés` : ''}
                            </span>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width:${progress}%;"></div>
                            </div>
                            <span class="progress-percent">${progress}%</span>
                            <span style="font-weight:700; color:var(--primary-orange);">${formattedPrice}</span>
                            <i class="fas fa-chevron-down toggle-icon"></i>
                        </div>

                        <div class="order-details">
                            <div class="details-grid">
                                <div class="detail-item">
                                    <div class="detail-label">ID Commande</div>
                                    <div class="detail-value">
                                        ${orderRef}
                                        <button class="copy-btn" onclick="event.stopPropagation(); copyTextToClipboard('${orderRef}', this)"><i class="far fa-copy"></i></button>
                                    </div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Date</div>
                                    <div class="detail-value">${dateStr}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Plateforme</div>
                                    <div class="detail-value"><i class="${iconClass}"></i> ${platform}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Qualité</div>
                                    <div class="detail-value">${quality}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Montant</div>
                                    <div class="detail-value" style="color:var(--primary-orange); font-weight:700;">${formattedPrice}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Lien</div>
                                    <div class="detail-value">
                                        <a href="${order.link}" target="_blank" onclick="event.stopPropagation();">Visiter</a>
                                        <button class="copy-btn" onclick="event.stopPropagation(); copyTextToClipboard('${order.link}', this)"><i class="far fa-copy"></i></button>
                                    </div>
                                </div>
                                ${order.isAutoOrder ? `
                                    <div class="detail-item"><div class="detail-label">Départ</div><div class="detail-value">${formatNumber(order.startCount || 0)}</div></div>
                                    <div class="detail-item"><div class="detail-label">Restants</div><div class="detail-value" style="color:var(--primary-orange);">${formatNumber(order.remains || 0)}</div></div>
                                ` : ''}
                                ${order.contactInfo ? `
                                    <div class="detail-item"><div class="detail-label">Contact</div><div class="detail-value">${order.contactInfo}</div></div>
                                ` : ''}
                            </div>

                            ${order.customComments ? `
                                <div class="comments-section">
                                    <div class="comments-title"><i class="fas fa-comment"></i> Commentaires</div>
                                    <div class="comments-content">${order.customComments}</div>
                                </div>
                            ` : ''}

                            ${renderShareSection(shareData)}

                            ${order.isAutoOrder ? `
                                <div class="exo-actions">
                                    <button class="exo-btn status" onclick="event.stopPropagation(); checkExoStatus('${order.id}')"><i class="fas fa-search"></i> Vérifier</button>
                                    <button class="exo-btn refill" onclick="event.stopPropagation(); requestExoRefill('${order.id}')"><i class="fas fa-redo"></i> Refill</button>
                                    <button class="exo-btn cancel" onclick="event.stopPropagation(); cancelExoOrder('${order.id}')"><i class="fas fa-times"></i> Annuler</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // Logique de déploiement de l'accordéon
            document.querySelectorAll('.order-card').forEach(card => {
                const icon = card.querySelector('.toggle-icon');
                const details = card.querySelector('.order-details');
                card.addEventListener('click', (e) => {
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    
                    const isOpen = details.classList.contains('open');
                    details.classList.toggle('open');
                    icon.className = isOpen ? 'fas fa-chevron-down toggle-icon' : 'fas fa-chevron-up toggle-icon';
                });
            });

            loadMoreContainer.style.display = displayedOrders.length > currentDisplayLimit ? 'block' : 'none';
        }

        // ---------- EXOSUPPLIER API CLIENT LOGIC ----------
        async function checkExoStatus(orderId) {
            try {
                showNotification('Mise à jour en cours...', 'info');
                const headers = await getAuthHeaders();
                const response = await fetch(API_BASE_URL + '/api/exo-status', { 
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ orderId: orderId })
                });
                
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Erreur lors de la vérification');
                
                showNotification(`Nouveau statut : ${data.status}`, 'success');
                await loadOrders();
            } catch (error) { 
                showNotification(error.message, 'error'); 
            }
        }

        async function requestExoRefill(orderId) {
            if (!confirm('Demander un refill pour cette commande ?')) return;
            try {
                showNotification('Demande de refill envoyée...', 'info');
                const headers = await getAuthHeaders();
                const response = await fetch(API_BASE_URL + '/api/exo/refill', { 
                    method: 'POST', 
                    headers: headers, 
                    body: JSON.stringify({ orderId }) 
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Erreur de refill');
                showNotification('Refill demandé avec succès !', 'success');
                await loadOrders();
            } catch (error) { 
                showNotification(error.message, 'error'); 
            }
        }

        async function cancelExoOrder(orderId) {
            if (!confirm('Voulez-vous annuler et rembourser cette commande ?')) return;
            try {
                showNotification('Annulation en cours...', 'info');
                const headers = await getAuthHeaders();
                const response = await fetch(API_BASE_URL + '/api/exo/cancel', { 
                    method: 'POST', 
                    headers: headers, 
                    body: JSON.stringify({ orderId }) 
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Erreur d\'annulation');
                const refundMsg = data.refundAmount > 0 
                    ? `Commande annulée ! ${formatNumber(data.refundAmount)} XAF recrédités.` 
                    : 'Commande annulée avec succès.';
                showNotification(refundMsg, 'success');
                await loadOrders();
            } catch (error) { 
                showNotification(error.message, 'error'); 
            }
        }

        // ---------- EVENT LISTENERS ----------
        document.getElementById('refreshBtn').addEventListener('click', async () => {
            await loadOrders();
        });

        document.getElementById('sortSelect').addEventListener('change', function() {
            currentSort = this.value;
            applySortAndDisplay();
        });

        document.getElementById('currencySelect').addEventListener('change', function() {
            selectedCountry = this.value;
            applySortAndDisplay();
        });

        document.getElementById('limitSelect').addEventListener('change', function() {
            currentDisplayLimit = parseInt(this.value);
            displayOrders();
        });

        document.getElementById('loadMoreBtn').addEventListener('click', function() {
            currentDisplayLimit += parseInt(document.getElementById('limitSelect').value);
            displayOrders();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                filterOrders(currentFilter);
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            auth.onAuthStateChanged(async user => {
                if (user) {
                    currentUser = user;
                    await loadOrders();
                } else {
                    window.location.href = 'connexion.html';
                }
            });
        });
    </script>
</body>
</html>
